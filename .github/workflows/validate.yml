name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack checks (bundles, resx, encodings)
        run: python3 tools/validate.py

      - name: JavaScript syntax
        run: |
          for f in $(git ls-files '*.js'); do
            echo "node --check $f"
            node --check "$f"
          done

      - name: NetScaler installer (sh)
        run: |
          sh -n netscaler/ua_langpack/ua_langpack.sh
          shellcheck -s sh -S warning netscaler/ua_langpack/ua_langpack.sh

      - name: StoreFront installer (PowerShell)
        shell: pwsh
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/storefront/Install-UALangPack.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'Install-UALangPack.ps1: no parse errors'
